name: コミックの書誌・発売日を取る（国会図書館・ほんのひきだし）
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'ndl（国会図書館）か hikidashi（ほんのひきだし）'
        required: true
        default: 'ndl'
      ranges:
        description: '期間（JSONの配列。例 ["2024-01 2024-12","2025-01 2025-12"]）'
        required: true
        default: '["2025-12 2025-12"]'
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        range: ${{ fromJSON(inputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取る（${{ inputs.task }} ${{ matrix.range }}）
        env:
          COMMIT: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.task }}" = "hikidashi" ]; then
            python3 tools/manga/hikidashi_harvest.py ${{ matrix.range }}
            git add data/manga/hikidashi.csv
            git commit -qm "ほんのひきだしのコミック発売日一覧を保存 [skip ci]" || true
            for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
          else
            python3 tools/manga/ndl_os_harvest.py ${{ matrix.range }}
          fi
