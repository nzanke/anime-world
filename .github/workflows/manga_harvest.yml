name: コミックの書誌を国会図書館サーチから年ごとに取る
on:
  workflow_dispatch:
    inputs:
      years:
        description: '取る年（JSONの配列。例 ["2024","2025","2026"]）'
        required: true
        default: '["2024","2025","2026"]'
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: ${{ fromJSON(inputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取る（${{ matrix.year }}年）
        run: |
          mkdir -p data/manga
          python3 tools/manga/ndl_harvest.py ${{ matrix.year }}-01 ${{ matrix.year }}-12 data/manga/
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manga
          git commit -m "国会図書館サーチのコミック書誌（${{ matrix.year }}年）を保存 [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((RANDOM % 20 + 5)); done
