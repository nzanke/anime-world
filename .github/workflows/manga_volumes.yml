name: 漫画の最新巻を国会図書館サーチで調べる
on:
  workflow_dispatch:
    inputs:
      titles:
        description: '作品名を | で区切って入れる'
        required: false
      script:
        description: '動かすスクリプト（ndl_volumes.py／ndl_probe.py／ndl_harvest.py）と引数'
        required: false
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/manga
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 調べる
        env:
          TITLES: ${{ inputs.titles }}
          SCRIPT: ${{ inputs.script }}
        run: |
          mkdir -p out
          if [ -n "$SCRIPT" ]; then
            eval "python3 tools/manga/$SCRIPT" | tee summary.md
          else
            python3 tools/manga/ndl_volumes.py "$TITLES" out/manga_volumes.json | tee summary.md
          fi
          tail -c 60000 summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 取得データをリポジトリに保存
        if: ${{ startsWith(inputs.script, 'ndl_harvest.py') }}
        run: |
          git sparse-checkout disable || true
          mkdir -p data/manga && cp out/*.gz data/manga/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manga
          git diff --cached --quiet || (git commit -m "国会図書館サーチのコミック書誌を保存 [skip ci]" && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manga_volumes
          path: out/
