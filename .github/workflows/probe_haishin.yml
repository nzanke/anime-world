name: 配信データの取り先を試す
on:
  push:
    branches: [probe-haishin]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          if [ -f DELETE_ME ]; then git push origin --delete probe-haishin; exit 0; fi
          pip install -q playwright && python3 tools/probe_render.py | tee probe/_render.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "取得の試し結果" && git push
