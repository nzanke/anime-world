<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コミック新刊リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--fg:#1d1d1b;--sub:#6b6a66;--line:#e4e2dc;--acc:#b8402c;--chip:#efece5;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#ecebe7;--sub:#a3a19b;--line:#33322f;--acc:#e0775f;--chip:#2a2927;--card:#232321}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"BIZ UDPGothic",sans-serif;font-size:15px;line-height:1.55}
.num,input,select{font-family:"BIZ UDGothic","BIZ UDPGothic",monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 8px}
h1{font-size:18px;margin:0 0 6px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 4px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.ctl input,.ctl select{font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-width:0}
.ctl input[type=search]{flex:1 1 180px}
.ctl select{flex:0 1 auto;max-width:48%}
.ctl label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.meta{font-size:12px;color:var(--sub);margin-top:6px}
main{padding:4px 14px 40px;max-width:820px;margin:0 auto}
h2.day{font-size:14px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--fg);display:flex;justify-content:space-between}
h2.day span{color:var(--sub);font-weight:400}
.it{padding:7px 0;border-bottom:1px solid var(--line)}
.t{font-weight:700}
.v{color:var(--acc);font-weight:700;margin-left:4px}
.s{font-size:12.5px;color:var(--sub)}
.s b{font-weight:400;background:var(--chip);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--fg)}
.sp{font-size:11px;border:1px solid var(--acc);color:var(--acc);border-radius:4px;padding:0 4px;margin-left:4px}
.more{display:block;margin:14px auto;padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.note{font-size:12px;color:var(--sub);margin:16px 0}
.empty{color:var(--sub);padding:30px 0;text-align:center}
</style>
</head>
<body>
<header>
  <h1>コミック新刊リスト</h1>
  <div class="tabs"><button id="tb-list" class="on">発売日順</button><button id="tb-works">作品ごとの最新巻</button></div>
  <div class="ctl">
    <select id="month" aria-label="発売月"></select>
    <select id="pub" aria-label="出版社"><option value="">出版社：すべて</option></select>
    <select id="lab" aria-label="レーベル"><option value="">レーベル：すべて</option></select>
    <input id="q" type="search" placeholder="書名・著者・レーベルで探す">
  </div>
  <div class="ctl" style="margin-top:6px">
    <label><input type="checkbox" id="first"> 1巻だけ</label>
    <label><input type="checkbox" id="nosp" checked> 特装版などを除く</label>
    <label id="lb-cont" hidden><input type="checkbox" id="cont" checked> 2巻以上の作品だけ</label>
    <select id="sort" aria-label="並び順" hidden><option value="vol">巻数が多い順</option><option value="date">最新巻の発売日が新しい順</option><option value="name">作品名順</option></select>
  </div>
  <div class="meta" id="meta"></div>
</header>
<main id="out"></main>
<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const R = D.rows; // [年月, 日, 出版社, レーベル, 作品名, 巻, 著者, 予価, ISBN, 特装]
const WD = ["日","月","火","水","木","金","土"];
const norm = s => s.normalize("NFKC").toLowerCase().replace(/\s+/g,"");
const hay = R.map(r => norm(r[4] + " " + r[6] + " " + D.labs[r[3]]));
let tab = "list", shown = 0;
const PAGE = 300;

const months = [...new Set(R.map(r => r[0]))].sort().reverse();
const today = new Date(); const cur = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0");
$("month").innerHTML = '<option value="">発売月：すべて</option>' + months.map(m => `<option value="${m}">${m.replace("-","年")}月</option>`).join("");
$("month").value = months.includes(cur) ? cur : months[0];
const pubCount = {}; R.forEach(r => pubCount[r[2]] = (pubCount[r[2]]||0)+1);
Object.keys(pubCount).sort((a,b)=>pubCount[b]-pubCount[a]).forEach(i => {
  const o = document.createElement("option"); o.value = i; o.textContent = D.pubs[i]; $("pub").appendChild(o);
});

function fillLabs(){
  const p = $("pub").value, keep = $("lab").value, c = {};
  R.forEach(r => { if(D.labs[r[3]] && (!p || String(r[2])===p)) c[r[3]] = (c[r[3]]||0)+1; });
  const ks = Object.keys(c).sort((a,b) => D.labs[a].localeCompare(D.labs[b], "ja"));
  $("lab").innerHTML = '<option value="">レーベル：すべて</option>' + ks.map(k => `<option value="${k}">${esc(D.labs[k])}（${c[k]}）</option>`).join("");
  if(ks.includes(keep)) $("lab").value = keep;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function dateLabel(r){
  if(r[1]===-1) return r[0].replace("-","年")+"月（日付不明・国会図書館の書誌より）";
  if(!r[1]) return r[0].replace("-","年")+"月（日付未定・下旬など）";
  const [y,m] = r[0].split("-").map(Number); const d = new Date(y, m-1, r[1]);
  return `${m}月${r[1]}日（${WD[d.getDay()]}）`;
}
function item(r, extra){
  const lab = D.labs[r[3]];
  return `<div class="it"><div><span class="t">${esc(r[4])}</span>${r[5]?`<span class="v num">${esc(r[5])}${/^\d+$/.test(r[5])?"巻":""}</span>`:""}${r[9]?'<span class="sp">特装版など</span>':""}</div>`+
    `<div class="s"><b>${esc(D.pubs[r[2]])}</b>${lab?esc(lab)+"　":""}${esc(r[6])}${r[7]&&/^\d+$/.test(r[7])?`　<span class="num">${r[7]}円</span>`:""}${extra||""}</div></div>`;
}
function filtered(){
  const L = $("lab").value, m = $("month").value, p = $("pub").value, q = norm($("q").value), first = $("first").checked, nosp = $("nosp").checked;
  const out = [];
  for(let i=0;i<R.length;i++){
    const r = R[i];
    if(m && r[0]!==m) continue;
    if(p && String(r[2])!==p) continue;
    if(L && String(r[3])!==L) continue;
    if(nosp && r[9]) continue;
    if(first && r[5]!=="1" && r[5]!=="上") continue;
    if(q && !hay[i].includes(q)) continue;
    out.push(i);
  }
  return out;
}
function renderList(reset){
  const ids = filtered();
  if(reset) shown = 0;
  const end = Math.min(ids.length, shown + PAGE);
  let h = reset ? "" : $("out").innerHTML.replace(/<button class="more"[^]*$/,"");
  let last = reset ? null : (ids[shown-1]!==undefined ? R[ids[shown-1]][0]+"/"+R[ids[shown-1]][1] : null);
  const cnt = {}; ids.forEach(i => {const k=R[i][0]+"/"+R[i][1]; cnt[k]=(cnt[k]||0)+1;});
  for(let j=shown;j<end;j++){
    const r = R[ids[j]], k = r[0]+"/"+r[1];
    if(k!==last){ h += `<h2 class="day">${dateLabel(r)}<span class="num">${cnt[k]}冊</span></h2>`; last = k; }
    h += item(r);
  }
  shown = end;
  if(shown < ids.length) h += `<button class="more">続きを表示（残り${ids.length-shown}冊）</button>`;
  if(!ids.length) h = '<div class="empty">該当する本はありません</div>';
  if(reset) h += "";
  $("out").innerHTML = h + (shown>=ids.length ? note() : "");
  $("meta").textContent = `${ids.length.toLocaleString()}冊`;
}
function renderWorks(reset){
  const L = $("lab").value, p = $("pub").value, q = norm($("q").value), cont = $("cont").checked, m = $("month").value;
  let ws = D.works.filter(([i,n]) => {
    const r = R[i];
    if(cont && n < 2 && !(/^\d+$/.test(r[5]) && +r[5] >= 2)) return false;
    if(p && String(r[2])!==p) return false;
    if(L && String(r[3])!==L) return false;
    if(m && r[0]!==m) return false;
    if(q && !hay[i].includes(q)) return false;
    return true;
  });
  const dk = i => R[i][0]+String(Math.max(R[i][1],0)).padStart(2,"0");
  const vn = i => { const v=R[i][5]; return /^\d+$/.test(v) ? +v : ({"上":1,"中":2,"下":3}[v]||0); };
  const sort = $("sort").value;
  if(sort==="vol") ws.sort((a,b) => vn(b[0])-vn(a[0]) || dk(b[0]).localeCompare(dk(a[0])));
  else if(sort==="name") ws.sort((a,b) => R[a[0]][4].localeCompare(R[b[0]][4], "ja"));
  else ws.sort((a,b) => dk(b[0]).localeCompare(dk(a[0])));
  if(reset) shown = 0;
  const end = Math.min(ws.length, shown + PAGE);
  let h = reset ? "" : $("out").innerHTML.replace(/<button class="more"[^]*$/,"");
  for(let j=shown;j<end;j++){
    const [i,n] = ws[j], r = R[i];
    h += item(r, `<br>最新巻の発売：<span class="num">${r[1]>0?r[0].replace("-","/")+"/"+String(r[1]).padStart(2,"0"):r[0].replace("-","/")+(r[1]<0?"（日付不明）":"（日付未定）")}</span>${n?`　期間内に<span class="num">${n}</span>冊`:""}`);
  }
  shown = end;
  if(shown < ws.length) h += `<button class="more">続きを表示（残り${ws.length-shown}作品）</button>`;
  if(!ws.length) h = '<div class="empty">該当する作品はありません</div>';
  $("out").innerHTML = h + (shown>=ws.length ? note() : "");
  $("meta").textContent = `${ws.length.toLocaleString()}作品`;
}
function note(){
  return `<p class="note">出典：ほんのひきだし「コミック新刊発売日一覧／コミック新刊ラインアップ」（${months[months.length-1].replace("-","年")}月〜${months[0].replace("-","年")}月分、発売日順の記事）。予定の発売日・予価は記事掲載時点のものです。ほんのひきだしにない本は、国会図書館の全国書誌データ（分類 NDC 726.1、ISBNのあるもの、2024〜2026年）から足しています（発売日は年月まで）。2026年2月・3月の前半（1日〜15日）は、ほんのひきだしに記事がないため国会図書館の書誌で補っています。「作品ごとの最新巻」は、この期間に出た巻のうち最も大きい巻数で、期間より前に出た巻は数えていません。</p>`;
}
function render(reset=true){ tab==="list" ? renderList(reset) : renderWorks(reset); }
$("out").addEventListener("click", e => { if(e.target.classList.contains("more")) render(false); });
["month","lab","first","nosp","cont","sort"].forEach(id => $(id).addEventListener("change", () => render()));
let tm; $("q").addEventListener("input", () => { clearTimeout(tm); tm = setTimeout(render, 200); });
function setTab(t){
  tab = t; $("tb-list").classList.toggle("on", t==="list"); $("tb-works").classList.toggle("on", t==="works");
  $("lb-cont").hidden = t!=="works"; $("sort").hidden = t!=="works"; $("first").parentElement.hidden = t!=="list"; $("nosp").parentElement.hidden = t!=="list";
  if(t==="works" && $("month").value===cur) $("month").value = "";
  try{ history.replaceState(null,"", t==="works" ? "#works" : "#list"); }catch(e){}
  render();
}
$("pub").addEventListener("change", () => { fillLabs(); render(); });
$("tb-list").onclick = () => setTab("list"); $("tb-works").onclick = () => setTab("works");
fillLabs();
setTab(location.hash==="#works" ? "works" : "list");
</script>
</body>
</html>
